name = "GammaPochhammer"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GammaPochhammer"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

# `checkdecls` provides the `lake exe checkdecls` executable used by
# `leanblueprint checkdecls` to verify every \lean{...} tag in the
# blueprint resolves to a real Lean declaration.
[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "GammaPochhammer"
