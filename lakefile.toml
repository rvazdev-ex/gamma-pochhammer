name = "GammaPochhammer"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GammaPochhammer"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

# doc-gen4 builds the API documentation that the blueprint links to.
# The revision is pinned to the Lean toolchain tag so it stays in sync
# with mathlib. Only fetched when the user/CI explicitly builds docs.
[[require]]
name = "«doc-gen4»"
scope = "leanprover"
rev = "v4.29.1"

[[lean_lib]]
name = "GammaPochhammer"
