[general]
renderer = HTML5
theme = blueprint

[document]
toc-depth = 2
toc-non-files = true
disable-style-and-script = false

[files]
split-level = 2
filename = ${id}.html
charset = utf-8

[images]
vector-imager = none
imager = none

[html5]
extra-css = blueprint.css
extra-css = extra_styles.css

[blueprint]
# These settings are consumed by the `blueprint` plasTeX plugin.
# Adjust them once the GitHub repository slug or the Lean library
# layout changes.
repo = https://github.com/rvazdev-ex/gamma-pochhammer
src_repo = https://github.com/rvazdev-ex/gamma-pochhammer/blob/main/
lib_prefix = GammaPochhammer
docs_url = https://rvazdev-ex.github.io/gamma-pochhammer/docs/
